<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Login</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

    :root {
      --bg-color: #040208;
      --card-bg: rgba(12, 6, 20, 0.88);
      --red-accent: #a855f7;
      --red-glow: rgba(168, 85, 247, 0.3);
      --purple-accent: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.3);
      --text-main: #f3e8ff;
      --text-muted: #a885c7;
      --border-color: rgba(168, 85, 247, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    .cyber-frame {
      width: 100%;
      max-width: 450px;
      background: radial-gradient(circle at 50% 20%, rgba(168, 85, 247, 0.15) 0%, rgba(4, 2, 8, 0.95) 70%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      position: relative;
      padding: 40px;
      box-shadow: 0 0 40px var(--red-glow), inset 0 0 15px rgba(168, 85, 247, 0.12);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(24px) scale(0.9);
      animation: loginFramePop 0.75s cubic-bezier(0.17, 0.67, 0.32, 1.25) forwards;
    }

    @keyframes loginFramePop {
      0% { opacity: 0; transform: translateY(24px) scale(0.9); }
      70% { opacity: 1; transform: translateY(-3px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .cyber-frame > * { opacity: 0; transform: translateY(12px); animation: loginContentPop 0.5s ease forwards; }
    .cyber-frame > .nav-header { animation-delay: 0.35s; }
    .cyber-frame > .hero-section { animation-delay: 0.48s; }
    .cyber-frame > #login-view { animation-delay: 0.62s; }
    @keyframes loginContentPop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
    }

  
    .cyber-frame::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 20px;
      width: 60px;
      height: 2px;
      background: var(--red-accent);
      box-shadow: 0 0 8px var(--red-accent);
    }

    .cyber-frame::after {
      content: '';
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: 2px;
      background: var(--red-accent);
      box-shadow: 0 0 8px var(--red-accent);
    }

    .nav-header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 30px;
      z-index: 2;
    }

    .nav-back {
      background: transparent;
      border: 1px solid var(--red-accent);
      color: var(--text-main);
      padding: 8px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
      position: relative;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .nav-back:hover {
      background: var(--red-accent);
      box-shadow: 0 0 15px var(--red-accent);
    }

    /* Hero/Title Section */
    .hero-section {
      text-align: center;
      margin-bottom: 30px;
      z-index: 2;
      position: relative;
    }

    .hero-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #ffffff 0%, #b5b5b5 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .hero-subtitle {
      font-size: 0.85rem;
      color: var(--red-accent);
      letter-spacing: 2px;
      font-weight: 700;
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--red-glow);
    }

    .form-heading {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .form-subheading {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .input-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      color: var(--red-accent);
      font-size: 1rem;
      width: 20px;
      text-align: center;
    }

    .input-control {
      width: 100%;
      padding: 12px 15px 12px 45px;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.85rem;
      transition: all 0.3s ease;
      font-family: 'Rajdhani', sans-serif;
    }

    .input-control::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .input-control:focus {
      outline: none;
      border-color: var(--red-accent);
      background-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
    }

    .alt-action-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .text-link {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .text-link:hover {
      color: var(--red-accent);
      text-shadow: 0 0 8px var(--red-glow);
    }

    #login-message {
      font-size: 0.8rem;
      margin-bottom: 12px;
      color: #d5adff;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #000;
      border: none;
      border-radius: 6px;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      margin-top: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
    }

    .hidden { display: none !important; }
    @media (max-width: 600px) { body { align-items:flex-start; padding:12px; } .cyber-frame { max-width:none; min-height:calc(100vh - 24px); padding:28px 18px 22px; } .nav-header { margin-bottom:22px; } .hero-section { margin-bottom:22px; } .hero-title { font-size:1.5rem; letter-spacing:2px; } .form-heading { font-size:1rem; } .input-control { font-size:.9rem; } }
  </style>
</head>
<body>

  <div class="cyber-frame">
    <!-- Navigation Back Button -->
    <div class="nav-header">
      <a href="index.html" class="nav-back">
        <i class="fas fa-arrow-left"></i>
        BACK
      </a>
    </div>

    <!-- Hero Title Section -->
    <div class="hero-section">
      <h1 class="hero-title">Officer Access</h1>
      <p class="hero-subtitle">Department Portal</p>
    </div>

    <div id="login-view">
      <h2 class="form-heading">Officer Access</h2>
      <p class="form-subheading">Sign in with your registered department officer account.</p>

      <form action="conn.php" method="post">
        <input type="hidden" name="action" value="officer_login">

        <div class="form-group">
          <label class="form-label" for="officer-full-name">Full Name</label>
          <div class="input-container">
            <i class="fas fa-user input-icon"></i>
            <input type="text" required class="input-control" id="officer-full-name" name="full_name" placeholder="Enter your full name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="officer-email">Email Address</label>
          <div class="input-container">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" required class="input-control" id="officer-email" name="email" placeholder="Email">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="officer-password">Password</label>
          <div class="input-container">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" required class="input-control" id="officer-password" name="password" placeholder="Password">
          </div>
        </div>

        <div id="login-message"></div>

        <button type="submit" class="btn-submit">
          <i class="fas fa-sign-in-alt"></i> Record Login
        </button>
      </form>
    </div>
  </div>

  <script>
    const message = new URLSearchParams(window.location.search).get('message');
    if (message) document.getElementById('login-message').textContent = message;
  </script>
</body>
</html>
